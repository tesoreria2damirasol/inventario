<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Inventario de alimentos</title>

  <style>
    :root {
      --rojo: #b20d18;
      --oscuro: #151b20;
      --fondo: #f4f6f8;
      --borde: #dce1e5;
      --gris: #66737d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--fondo);
      color: #172026;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 15px;
      background: var(--oscuro);
      color: white;
    }

    .encabezado,
    main {
      width: min(1050px, 100%);
      margin: auto;
    }

    .encabezado {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    h1 {
      margin: 0;
      font-size: 21px;
    }

    main {
      padding: 20px 14px 60px;
    }

    .panel,
    .tarjeta {
      padding: 18px;
      background: white;
      border: 1px solid var(--borde);
      border-radius: 16px;
      box-shadow: 0 2px 8px #00000010;
    }

    .login {
      width: min(380px, calc(100% - 28px));
      margin: 10vh auto;
    }

    .login h2 {
      text-align: center;
    }

    .resumen {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .tarjeta small {
      color: var(--gris);
    }

    .tarjeta strong {
      display: block;
      margin-top: 10px;
      font-size: 27px;
    }

    .pestanas {
      display: flex;
      gap: 5px;
      margin-bottom: 15px;
      padding: 5px;
      overflow-x: auto;
      background: white;
      border-radius: 11px;
    }

    .pestanas button {
      padding: 10px 14px;
      border: 0;
      background: transparent;
      font-weight: bold;
      white-space: nowrap;
    }

    .pestanas button.activa {
      border-radius: 8px;
      background: var(--rojo);
      color: white;
    }

    .vista {
      display: none;
    }

    .vista.activa {
      display: block;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px;
    }

    .ancho {
      grid-column: 1 / -1;
    }

    label {
      font-size: 14px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      margin-top: 6px;
      padding: 11px;
      border: 1px solid #cbd2d8;
      border-radius: 8px;
      background: white;
      font-size: 16px;
    }

    .boton {
      padding: 11px 15px;
      border: 0;
      border-radius: 9px;
      background: var(--rojo);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .secundario {
      border: 1px solid var(--borde);
      background: white;
      color: #172026;
    }

    .escaner {
      margin-bottom: 15px;
      padding: 15px;
      border-radius: 13px;
      background: var(--oscuro);
      color: white;
    }

    .escaner button {
      width: 100%;
      margin: 10px 0;
      background: white;
      color: black;
    }

    .mensaje {
      padding: 10px;
      border-radius: 8px;
      background: #fff3cd;
      color: #664d03;
    }

    .oculto {
      display: none !important;
    }

    .tabla {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 650px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 10px;
      border-bottom: 1px solid #eeeeee;
      text-align: left;
    }

    th {
      background: #eef1f4;
    }

    .movimiento {
      margin: 8px 0;
      padding: 11px;
      border: 1px solid var(--borde);
      border-radius: 10px;
    }

    .movimiento small {
      color: var(--gris);
    }

    #camara {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      place-items: center;
      padding: 15px;
      background: #000000e8;
      color: white;
    }

    #camara.abierta {
      display: grid;
    }

    video {
      width: min(520px, 100%);
      max-height: 75vh;
      border: 2px solid white;
      border-radius: 15px;
    }

    @media (max-width: 650px) {
      .resumen {
        grid-template-columns: 1fr 1fr;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .ancho {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>
  <section id="login" class="panel login">
    <h2>Inventario de alimentos</h2>

    <form id="formLogin" class="grid">
      <label class="ancho">
        Usuario
        <input
          id="usuario"
          autocomplete="username"
          required
        >
      </label>

      <label class="ancho">
        Clave
        <input
          id="clave"
          type="password"
          autocomplete="current-password"
          required
        >
      </label>

      <div
        id="mensajeLogin"
        class="ancho"
      ></div>

      <button class="boton ancho">
        Ingresar
      </button>
    </form>
  </section>

  <div id="aplicacion" class="oculto">
    <header>
      <div class="encabezado">
        <h1>🔥 Inventario de alimentos</h1>

        <div>
          <span id="nombreUsuario"></span>

          <button
            id="salir"
            class="boton secundario"
          >
            Salir
          </button>
        </div>
      </div>
    </header>

    <main>
      <section class="resumen">
        <article class="tarjeta">
          <small>Productos</small>
          <strong id="totalProductos">0</strong>
        </article>

        <article class="tarjeta">
          <small>Stock bajo</small>
          <strong id="stockBajo">0</strong>
        </article>

        <article class="tarjeta">
          <small>Por vencer</small>
          <strong id="porVencer">0</strong>
        </article>

        <article class="tarjeta">
          <small>Gasto del mes</small>
          <strong id="gastoMes">$0</strong>
        </article>
      </section>

      <nav class="pestanas">
        <button
          class="activa"
          data-vista="inventario"
        >
          Inventario
        </button>

        <button data-vista="registrar">
          Registrar
        </button>

        <button data-vista="historial">
          Historial
        </button>

        <button data-vista="gastos">
          Gastos
        </button>
      </nav>

      <section
        id="inventario"
        class="vista activa panel tabla"
      >
        Cargando...
      </section>

      <section
        id="registrar"
        class="vista"
      >
        <div class="panel">
          <p>
            <button
              class="boton"
              data-tipo="entrada"
            >
              Entrada
            </button>

            <button
              class="boton secundario"
              data-tipo="salida"
            >
              Salida
            </button>
          </p>

          <div class="escaner">
            <strong>
              Escanea el código
            </strong>

            <button
              id="abrirCamara"
              class="boton"
              type="button"
            >
              Abrir cámara
            </button>

            <input
              id="codigo"
              placeholder="O escribe el código"
            >
          </div>

          <form
            id="formMovimiento"
            class="grid"
          >
            <label class="nuevo">
              Nombre
              <input id="nombreProducto">
            </label>

            <label class="nuevo">
              Categoría
              <select id="categoria">
                <option>Abarrotes</option>
                <option>Bebidas</option>
                <option>Congelados</option>
                <option>Refrigerados</option>
                <option>Condimentos</option>
                <option>Otros</option>
              </select>
            </label>

            <label class="nuevo">
              Unidad
              <select id="unidad">
                <option>unidad</option>
                <option>kg</option>
                <option>litro</option>
                <option>paquete</option>
                <option>caja</option>
                <option>tarro</option>
              </select>
            </label>

            <label class="nuevo">
              Stock mínimo
              <input
                id="minimo"
                type="number"
                value="2"
              >
            </label>

            <label>
              Cantidad
              <input
                id="cantidad"
                type="number"
                min="0.01"
                step="0.01"
                required
              >
            </label>

            <label class="nuevo">
              Vencimiento
              <input
                id="vencimiento"
                type="date"
              >
            </label>

            <label class="nuevo">
              Costo total
              <input
                id="costo"
                type="number"
                min="0"
              >
            </label>

            <label class="ancho">
              Observación
              <input id="observacion">
            </label>

            <div
              id="mensaje"
              class="ancho"
            ></div>

            <button class="boton ancho">
              Registrar movimiento
            </button>
          </form>
        </div>
      </section>

      <section
        id="historial"
        class="vista panel"
      ></section>

      <section
        id="gastos"
        class="vista panel"
      ></section>
    </main>
  </div>

  <div id="camara">
    <div>
      <button
        id="cerrarCamara"
        class="boton secundario"
      >
        Cerrar
      </button>

      <h3>Apunta al código de barras</h3>

      <video
        id="video"
        playsinline
        muted
      ></video>

      <p id="ayudaCamara">
        Mantén el código centrado.
      </p>
    </div>
  </div>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbxuZPxZ4xDSwseDC79UbQ6C6yystjIdxKVTvI5m7H7r-f8IfF3yNy6Rn-kXcl-oSygVPw/exec";

    let token =
      localStorage.getItem("inventarioToken") || "";

    let productos = [];
    let movimientos = [];
    let tipoMovimiento = "entrada";
    let streamCamara = null;

    const elemento = id =>
      document.getElementById(id);

    function llamarAPI(parametros) {
      return new Promise(
        (resolver, rechazar) => {
          const callback =
            "respuesta_" +
            Date.now() +
            "_" +
            Math.floor(
              Math.random() * 100000
            );

          const script =
            document.createElement("script");

          const tiempo = setTimeout(
            () => {
              delete window[callback];
              script.remove();

              rechazar(
                new Error(
                  "La base de datos no respondió."
                )
              );
            },
            20000
          );

          window[callback] = respuesta => {
            clearTimeout(tiempo);
            delete window[callback];
            script.remove();

            if (!respuesta.ok) {
              rechazar(
                new Error(respuesta.error)
              );

              return;
            }

            resolver(respuesta);
          };

          script.src =
            API_URL +
            "?" +
            new URLSearchParams({
              ...parametros,
              callback
            });

          script.onerror = () => {
            rechazar(
              new Error(
                "No fue posible conectar con Apps Script."
              )
            );
          };

          document.body.appendChild(script);
        }
      );
    }

    async function cifrarClave(clave) {
      const datos =
        new TextEncoder().encode(clave);

      const hash =
        await crypto.subtle.digest(
          "SHA-256",
          datos
        );

      return Array.from(
        new Uint8Array(hash)
      )
        .map(valor =>
          valor
            .toString(16)
            .padStart(2, "0")
        )
        .join("");
    }

    elemento("formLogin")
      .addEventListener(
        "submit",
        async evento => {
          evento.preventDefault();

          elemento("mensajeLogin")
            .className =
            "ancho mensaje";

          elemento("mensajeLogin")
            .textContent =
            "Ingresando...";

          try {
            const respuesta =
              await llamarAPI({
                accion: "login",
                usuario:
                  elemento("usuario").value,
                clave:
                    elemento("clave").value
              });

            token = respuesta.token;

            localStorage.setItem(
              "inventarioToken",
              token
            );

            abrirAplicacion(
              respuesta.usuario
            );

            await cargarInventario();
          } catch (error) {
            elemento("mensajeLogin")
              .textContent =
              error.message;
          }
        }
      );

    function abrirAplicacion(usuario) {
      elemento("login")
        .classList.add("oculto");

      elemento("aplicacion")
        .classList.remove("oculto");

      elemento("nombreUsuario")
        .textContent =
        usuario.nombre;
    }

    async function cargarInventario() {
      try {
        const respuesta =
          await llamarAPI({
            accion: "inventario",
            token
          });

        productos =
          respuesta.productos || [];

        movimientos =
          respuesta.movimientos || [];

        abrirAplicacion(
          respuesta.usuario
        );

        mostrarInformación();
      } catch (error) {
        localStorage.removeItem(
          "inventarioToken"
        );

        token = "";

        elemento("aplicacion")
          .classList.add("oculto");

        elemento("login")
          .classList.remove("oculto");

        elemento("mensajeLogin")
          .className =
          "ancho mensaje";

        elemento("mensajeLogin")
          .textContent =
          error.message;
      }
    }

    function mostrarInformación() {
      const limite = new Date();

      limite.setDate(
        limite.getDate() + 30
      );

      const bajos =
        productos.filter(
          producto =>
            producto.stock <=
            producto.stockMinimo
        );

      const vencen =
        productos.filter(
          producto =>
            producto.vencimiento &&
            new Date(
              producto.vencimiento +
              "T12:00:00"
            ) <= limite
        );

      const mesActual =
        new Date()
          .toISOString()
          .slice(0, 7);

      const gasto =
        movimientos
          .filter(
            movimiento =>
              movimiento.tipo ===
                "entrada" &&
              movimiento.fecha.slice(
                0,
                7
              ) === mesActual
          )
          .reduce(
            (total, movimiento) =>
              total +
              movimiento.costo,
            0
          );

      elemento("totalProductos")
        .textContent =
        productos.length;

      elemento("stockBajo")
        .textContent =
        bajos.length;

      elemento("porVencer")
        .textContent =
        vencen.length;

      elemento("gastoMes")
        .textContent =
        formatoDinero(gasto);

      mostrarInventario();
      mostrarHistorial();
      mostrarGastos();
    }

    function mostrarInventario() {
      if (!productos.length) {
        elemento("inventario")
          .textContent =
          "Todavía no hay productos.";

        return;
      }

      elemento("inventario")
        .innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Producto</th>
                <th>Categoría</th>
                <th>Stock</th>
                <th>Vencimiento</th>
              </tr>
            </thead>

            <tbody>
              ${productos
                .map(
                  producto => `
                    <tr>
                      <td>
                        <strong>
                          ${escapar(
                            producto.nombre
                          )}
                        </strong>
                      </td>

                      <td>
                        ${escapar(
                          producto.categoria
                        )}
                      </td>

                      <td>
                        ${producto.stock}
                        ${escapar(
                          producto.unidad
                        )}
                      </td>

                      <td>
                        ${
                          producto.vencimiento ||
                          "Sin fecha"
                        }
                      </td>
                    </tr>
                  `
                )
                .join("")}
            </tbody>
          </table>
        `;
    }

    function mostrarHistorial() {
      elemento("historial")
        .innerHTML =
        "<h2>Historial</h2>" +
        movimientos
          .map(
            movimiento => `
              <article class="movimiento">
                <strong>
                  ${escapar(
                    movimiento.producto
                  )}
                  · ${movimiento.cantidad}
                </strong>

                <br>

                <small>
                  ${escapar(
                    movimiento.tipo
                  )}
                  por
                  ${escapar(
                    movimiento.responsable
                  )}
                  ·
                  ${escapar(
                    movimiento.fecha
                  )}
                </small>
              </article>
            `
          )
          .join("");
    }

    function mostrarGastos() {
      const gastos = {};

      movimientos
        .filter(
          movimiento =>
            movimiento.tipo === "entrada"
        )
        .forEach(movimiento => {
          const mes =
            movimiento.fecha.slice(0, 7);

          gastos[mes] =
            (gastos[mes] || 0) +
            movimiento.costo;
        });

      elemento("gastos")
        .innerHTML =
        "<h2>Gastos mensuales</h2>" +
        Object.entries(gastos)
          .sort()
          .reverse()
          .map(
            ([mes, total]) => `
              <article class="movimiento">
                <strong>${mes}</strong>

                <span style="float:right">
                  ${formatoDinero(total)}
                </span>
              </article>
            `
          )
          .join("");
    }

    elemento("formMovimiento")
      .addEventListener(
        "submit",
        async evento => {
          evento.preventDefault();

          elemento("mensaje")
            .className =
            "ancho mensaje";

          elemento("mensaje")
            .textContent =
            "Guardando...";

          try {
            const respuesta =
              await llamarAPI({
                accion: "registrar",
                token,
                tipo: tipoMovimiento,
                codigo:
                  elemento("codigo").value,
                nombre:
                  elemento(
                    "nombreProducto"
                  ).value,
                categoria:
                  elemento("categoria")
                    .value,
                unidad:
                  elemento("unidad").value,
                stockMinimo:
                  elemento("minimo").value,
                cantidad:
                  elemento("cantidad")
                    .value,
                vencimiento:
                  elemento("vencimiento")
                    .value,
                costo:
                  elemento("costo").value,
                observacion:
                  elemento("observacion")
                    .value
              });

            elemento("mensaje")
              .textContent =
              respuesta.mensaje;

            evento.target.reset();

            elemento("minimo").value = 2;
            elemento("codigo").value = "";

            await cargarInventario();
          } catch (error) {
            elemento("mensaje")
              .textContent =
              error.message;
          }
        }
      );

    document
      .querySelectorAll("[data-vista]")
      .forEach(boton => {
        boton.onclick = () => {
          document
            .querySelectorAll(
              "[data-vista], .vista"
            )
            .forEach(elemento =>
              elemento.classList.remove(
                "activa"
              )
            );

          boton.classList.add("activa");

          elemento(
            boton.dataset.vista
          ).classList.add("activa");
        };
      });

    document
      .querySelectorAll("[data-tipo]")
      .forEach(boton => {
        boton.onclick = () => {
          tipoMovimiento =
            boton.dataset.tipo;

          document
            .querySelectorAll(
              "[data-tipo]"
            )
            .forEach(elemento => {
              elemento.className =
                "boton " +
                (
                  elemento === boton
                    ? ""
                    : "secundario"
                );
            });

          document
            .querySelectorAll(".nuevo")
            .forEach(elemento => {
              elemento.classList.toggle(
                "oculto",
                tipoMovimiento === "salida"
              );
            });
        };
      });

    function reconocerCodigo(codigo) {
      elemento("codigo").value = codigo;

      const producto =
        productos.find(
          producto =>
            producto.codigo === codigo
        );

      elemento("mensaje")
        .className =
        "ancho mensaje";

      if (producto) {
        elemento("nombreProducto")
          .value =
          producto.nombre;

        elemento("mensaje")
          .textContent =
          "Código reconocido: " +
          producto.nombre;
      } else {
        elemento("mensaje")
          .textContent =
          "Código nuevo. Completa sus datos.";
      }
    }

    elemento("codigo")
      .addEventListener(
        "change",
        evento =>
          reconocerCodigo(
            evento.target.value.trim()
          )
      );

    elemento("abrirCamara")
      .onclick =
      async () => {
        elemento("camara")
          .classList.add("abierta");

        try {
          streamCamara =
            await navigator
              .mediaDevices
              .getUserMedia({
                video: {
                  facingMode: {
                    ideal: "environment"
                  }
                }
              });

          elemento("video")
            .srcObject =
            streamCamara;

          await elemento("video").play();

          if (
            !("BarcodeDetector" in window)
          ) {
            elemento("ayudaCamara")
              .textContent =
              "Este navegador no admite lectura automática.";

            return;
          }

          const detector =
            new BarcodeDetector({
              formats: [
                "ean_13",
                "ean_8",
                "upc_a",
                "upc_e",
                "code_128",
                "code_39",
                "itf"
              ]
            });

          async function detectar() {
            if (!streamCamara) {
              return;
            }

            try {
              const resultados =
                await detector.detect(
                  elemento("video")
                );

              if (resultados.length) {
                reconocerCodigo(
                  resultados[0].rawValue
                );

                cerrarCamara();
                return;
              }
            } catch (error) {
              console.log(error);
            }

            requestAnimationFrame(
              detectar
            );
          }

          detectar();
        } catch (error) {
          elemento("ayudaCamara")
            .textContent =
            "No fue posible abrir la cámara.";
        }
      };

    function cerrarCamara() {
      if (streamCamara) {
        streamCamara
          .getTracks()
          .forEach(pista =>
            pista.stop()
          );
      }

      streamCamara = null;

      elemento("camara")
        .classList.remove("abierta");
    }

    elemento("cerrarCamara")
      .onclick = cerrarCamara;

    elemento("salir")
      .onclick =
      async () => {
        try {
          await llamarAPI({
            accion: "logout",
            token
          });
        } catch (error) {}

        localStorage.removeItem(
          "inventarioToken"
        );

        location.reload();
      };

    function formatoDinero(valor) {
      return new Intl.NumberFormat(
        "es-CL",
        {
          style: "currency",
          currency: "CLP",
          maximumFractionDigits: 0
        }
      ).format(valor || 0);
    }

    function escapar(valor) {
      return String(valor || "")
        .replace(
          /[&<>"']/g,
          caracter => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
          })[caracter]
        );
    }

    if (token) {
      cargarInventario();
    }
  </script>
</body>
</html>
